<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام السيطرة المخزنية والمحاسبية</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══════════ شاشة الدخول ═══════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="seal">🏛</div>
    <div class="login-title">نظام السيطرة المخزنية والمحاسبية</div>
    <div class="login-sub">تسجيل الدخول للمتابعة</div>

    <div id="pane-login">
      <div class="login-field"><label>البريد الإلكتروني</label><input id="l-email" type="email" autocomplete="username"></div>
      <div class="login-field"><label>كلمة المرور</label><input id="l-pass" type="password" autocomplete="current-password"></div>
      <button class="btn-login" onclick="doLogin()">تسجيل الدخول</button>
      <div class="login-err" id="login-err"></div>
      <div class="login-switch">لا تملك حساباً؟ <a href="javascript:showAuthPane('signup')">إنشاء حساب جديد</a></div>
    </div>

    <div id="pane-signup" class="hidden">
      <div class="login-field"><label>الاسم الكامل</label><input id="s-name"></div>
      <div class="login-field"><label>البريد الإلكتروني</label><input id="s-email" type="email"></div>
      <div class="login-field"><label>كلمة المرور</label><input id="s-pass" type="password"></div>
      <div class="login-field"><label>تأكيد كلمة المرور</label><input id="s-pass2" type="password"></div>
      <button class="btn-login" onclick="doSignup()">إنشاء الحساب</button>
      <div class="login-err" id="signup-err"></div>
      <div class="login-switch">تملك حساباً؟ <a href="javascript:showAuthPane('login')">تسجيل الدخول</a></div>
    </div>
  </div>
</div>

<!-- ═══════════ شاشة بانتظار الموافقة ═══════════ -->
<div id="pending-screen" class="hidden">
  <div class="login-box">
    <div class="seal">⏳</div>
    <div class="login-title">حسابك بانتظار الموافقة</div>
    <div class="login-sub">تم إنشاء حسابك بنجاح، وهو الآن بانتظار موافقة مدير النظام قبل ما تكدر تستخدم النظام. راجع مدير النظام لتفعيل حسابك.</div>
    <button class="btn-login" onclick="doLogout()">تسجيل الخروج</button>
  </div>
</div>

<!-- ═══════════ هيكل التطبيق ═══════════ -->
<div id="app-shell" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        <div class="brand-seal">🏛</div>
        <div><div class="brand-name">السيطرة المخزنية</div><div class="brand-sub">والمحاسبية</div></div>
      </div>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-foot">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">?</div>
        <div><div class="user-name" id="user-name"></div><div class="user-role" id="user-role"></div></div>
      </div>
      <button class="btn-out" onclick="toggleTheme()" style="margin-bottom:8px">🌓 تبديل المظهر</button>
      <button class="btn-out" onclick="doLogout()">تسجيل الخروج</button>
    </div>
  </aside>
  <div class="app-col">
    <!-- ═══ الشريط العلوي (القائمة الرئيسية) ═══ -->
    <div class="topmenu" id="topmenu">
      <button class="topmenu-burger no-print" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="tm-bar" id="topmenu-bar"></div>
    </div>
    <main class="main">
      <div id="page-root"></div>
    </main>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- SheetJS (استيراد/تصدير إكسل) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Chart.js (اللوحة البيانية بلوحة التحكم) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- JsBarcode (تصميم وطباعة الباركود) -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script src="config.js"></script>
<script src="supabaseClient.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="inventory.js"></script>
<script src="accounting.js"></script>
<script src="reports.js"></script>
<script src="admin.js"></script>
<script src="fiscal.js"></script>
<script src="treasury.js"></script>
<script src="pettycash.js"></script>
<script src="customers.js"></script>
<script src="masterdata.js"></script>
<script src="masterdata2.js"></script>
<script src="reports2.js"></script>
<script src="orders.js"></script>
<script src="debtnotes.js"></script>
<script src="attachments.js"></script>
<script src="manufacturing.js"></script>
<script src="settings2.js"></script>
<script src="settings3.js"></script>
<script src="masterdata3.js"></script>
<script src="reps.js"></script>
<script src="profit.js"></script>
<script src="budgetrollover.js"></script>
<script src="settings4.js"></script>
<script src="ops.js"></script>
</body>
</html>
